<!DOCTYPE html>
<html>

<head>
    <title>Search Animals by Name</title>
    <link rel="stylesheet" href="40475684_style/styles.css">
</head>

<body>

    <h1>Search Animals by Name</h1>

    <div class="nav-buttons">
        <button onclick="window.location.href='animals.html'">Back</button>
    </div>

    <!-- Search input -->
    <input type="text" id="nameInput" placeholder="Enter animal name">
    <button onclick="runSearch()">Search</button>

    <p id="message"></p>

    <!-- Results table -->
    <table border="1" id="animalTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Species</th>
                <th>Gender</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const runQuery = async (sql) => {
            try {
                const response = await fetch("https://jkilleen02.webhosting1.eeecs.qub.ac.uk/dbConnector.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: "query=" + encodeURIComponent(sql)
                })

                return await response.json();
            } catch (error) {
                console.log(error.message);
            }
        };

        const runSearch = async () => {
            const name = document.getElementById("nameInput").value.trim();
            const message = document.getElementById("message");
            const tbody = document.querySelector("#animalTable tbody");

            tbody.innerHTML = "";

            if (!name) {
                message.innerText = "Please enter a name.";
                return;
            }

            //Query being executed
            const sql = `SELECT * FROM tblanimal WHERE animalName LIKE '%${name}%'`;

            const result = await runQuery(sql);
            console.log(result);

            if (!result || !result.success || result.data.length === 0) {
                message.innerText = "No results found.";
                return;
            }

            message.innerText = "";

            result.data.forEach(animal => {
                tbody.innerHTML += `
                    <tr>
                        <td>${animal.animalID}</td>
                        <td>${animal.animalName}</td>
                        <td>${animal.animalAge ?? ""}</td>
                        <td>${animal.animalSpecies}</td>
                        <td>${animal.gender}</td>
                    </tr>
                `;
            });
        };
    </script>

</body>

</html>
