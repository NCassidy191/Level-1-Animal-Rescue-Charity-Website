<!DOCTYPE html>
<html>

<head>
    <title>Members and Adopted Animals</title>
    <link rel="stylesheet" href="40475684_style/styles.css">
</head>

<body>

    <h1>Members and Their Adopted Animals</h1>

    <div class="nav-buttons">
        <button onclick="window.location.href='animals.html'">Back</button>
    </div>

    <p id="message"></p>

    <table border="1" id="reportTable">
        <thead>
            <tr> <!--Table Headers-->
                <th>Member ID</th>
                <th>Full Name</th>

                <th>Animal Name</th>
                <th>Species</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const runQuery = async (sql) => {
            try {
                const response = await fetch("https://jkilleen02.webhosting1.eeecs.qub.ac.uk/dbConnector.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: "query=" + encodeURIComponent(sql)
                })

                return await response.json();
            } catch (error) {
                console.log(error.message);
            }
        };

        const loadReport = async () => {

            const sql = "SELECT m.memberID, CONCAT(m.memberFirstName, ' ', m.memberLastName) AS fullName, a.animalName, a.animalSpecies FROM tblmembers m INNER JOIN tbladoption ad ON m.memberID = ad.memberID INNER JOIN tblanimal a ON ad.animalID = a.animalID WHERE ad.adoptionStatus = 'Complete' ORDER BY m.memberLastName, m.memberFirstName";

            const result = await runQuery(sql);
            console.log(result);

            const tbody = document.querySelector("#reportTable tbody");
            const message = document.getElementById("message");

            tbody.innerHTML = "";

            if (!result || !result.success) {
                message.innerText = "Error loading report.";
                return;
            }

            if (result.data.length === 0) {
                message.innerText = "No adoption records found.";
                return;
            }

            message.innerText = "";

            result.data.forEach(row => {
                tbody.innerHTML += `
    <tr>
        <td>${row.memberID}</td>   
        <td>${row.fullName}</td>
        
        <td>${row.animalName}</td>
        <td>${row.animalSpecies}</td>
    </tr>
`;
            });
        };

        window.onload = loadReport;
    </script>

</body>

</html>
