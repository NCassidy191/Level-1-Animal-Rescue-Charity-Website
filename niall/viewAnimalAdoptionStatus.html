<!DOCTYPE html>
<html>

<head>
    <title>Simple Animal Report</title>
    <link rel="stylesheet" href="40475684_style/styles.css">
</head>

<body>

    <h1>Animal Applications Report</h1>

    <div class="nav-buttons">
        <button onclick="window.location.href='animals.html'">Back</button>
    </div>

    <p id="message"></p>

    <table border="1" id="reportTable"> <!-- Table headers-->
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Species</th>
                <th>Age</th>
                <th>Total Applications</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const runQuery = async (sql) => {
            try {
                const response = await fetch("https://jkilleen02.webhosting1.eeecs.qub.ac.uk/dbConnector.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: "query=" + encodeURIComponent(sql)
                })

                return await response.json();
            } catch (error) {
                console.log(error.message);
            }
        };

        const loadReport = async () => {

            const sql = "SELECT a.animalID, a.animalName, a.animalSpecies, a.animalAge, COUNT(ad.adoptionID) AS totalApplications FROM tblanimal a LEFT JOIN tbladoption ad ON a.animalID = ad.animalID GROUP BY a.animalID, a.animalName, a.animalSpecies, a.animalAge ORDER BY totalApplications DESC;";

            const result = await runQuery(sql);
            console.log(result); //  for debugging

            const tbody = document.querySelector("#reportTable tbody");
            const message = document.getElementById("message");

            tbody.innerHTML = "";

            if (!result || !result.success) {
                message.innerText = "Error loading report."; //If sql query failed
                return;
            }

            if (result.data.length === 0) {
                message.innerText = "No data found."; //If no data from query
                return;
            }

            message.innerText = "";

            result.data.forEach(animal => { //Fill in each table
                tbody.innerHTML += ` 
                    <tr>
                        <td>${animal.animalID}</td>  
                        <td>${animal.animalName}</td>
                        <td>${animal.animalSpecies}</td>
                        <td>${animal.animalAge ?? ""}</td>
                        <td>${animal.totalApplications}</td>
                    </tr>
                `;
            });
        };

        window.onload = loadReport;
    </script>

</body>

</html>
